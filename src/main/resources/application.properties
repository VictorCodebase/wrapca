spring.application.name=WrapCa
server.port=8080
wrap.data.root=./data
wrap.data.roads-path=./data/osm/roads.geojson
wrap.data.esa-path=./data/esa/esa_worldcover.tif
spring.mvc.converters.preferred-json-mapper=jackson
wrap.simulation.cell-size-metres=100
wrap.simulation.time-step-minutes=10
wrap.simulation.monte-carlo-runs=100
wrap.simulation.thread-pool-size=4
wrap.simulation.phase1-horizon-hours=8
wrap.cv.geotiff-path=./data/geotiff/cv_fuel_state_2026-04-29.tif
wrap.cv.local-geotiff-path=./data/geotiff/latest_cv_output.tif
wrap.data.fuel-risk-path=./data/cv/fuel_risk_map.tif
wrap.cv.stub-mode=true
wrap.cv.base-url=http://localhost:5000/api/cv
# TODO: Change the cv base url to the actual
# Actuator: exposes /actuator/metrics, /actuator/health, /actuator/info
management.endpoints.web.exposure.include=env,health,info,metrics,loggers
management.endpoint.health.show-details=always
# Logging levels: set simulation packages to DEBUG for development
logging.level.com.victorkithinji.wrap.wrapca.facade=DEBUG
logging.level.com.victorkithinji.wrap.wrapca.montecarlo=DEBUG
logging.level.com.victorkithinji.wrap.wrapca.simulation=DEBUG
logging.level.com.victorkithinji.wrap.wrapca.correction=DEBUG
# Log pattern: include thread name so you can see ForkJoinPool threads
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
spring.profiles.active=perf

